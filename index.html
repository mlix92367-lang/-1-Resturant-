<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نبع العراد - عجمان</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#F5EFE6;color:#4E3629;padding:10px;padding-bottom:380px}
.header{text-align:center;padding:22px;background:#FFFDF9;border-radius:22px;margin-bottom:14px;border:1px solid #E8DCCF}
.header h1{font-size:27px;color:#4E3629}.header p{font-size:12px;color:#A68B77;line-height:1.8}
.cat{background:#4E3629;color:#F5EFE6;padding:10px 16px;border-radius:12px;font-weight:800;margin:24px 0 12px}
.item{background:#FFFDF9;border:1px solid #E8DCCF;border-radius:18px;padding:13px;display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
.item-info h3{font-size:14px;font-weight:800;color:#4E3629}.en{font-size:11px;color:#BCA89A}
.price{color:#8B5E3C;font-weight:800;font-size:13px;margin-top:4px}
.sizes{display:flex;gap:6px;margin-top:9px}
.size{border:1px solid #E8DCCF;padding:5px 12px;border-radius:20px;font-size:11px;cursor:pointer;background:#F5EFE6;color:#8B5E3C;font-weight:700}
.size.active{background:#4E3629;color:#FFFDF9;border-color:#4E3629}
.qty{display:flex;align-items:center;gap:8px;background:#F5EFE6;border-radius:22px;padding:4px 9px;border:1px solid #E8DCCF}
.qty button{width:28px;height:28px;border:none;background:#4E3629;color:#FFFDF9;border-radius:50%;font-size:18px;cursor:pointer}
.qty span{font-weight:800;min-width:16px;text-align:center;font-size:14px}
.form{background:#FFFDF9;border-radius:22px;padding:16px;margin-top:24px;border:1px solid #E8DCCF}
.form h3{font-size:15px;margin-bottom:12px;color:#4E3629}
.form input,.form select{width:100%;padding:12px;border-radius:12px;border:1px solid #E8DCCF;background:#F5EFE6;color:#4E3629;margin-bottom:10px;font-size:14px;outline:none}
.row{display:flex;gap:10px}.row>*{flex:1}
#map{width:100%;height:210px;border-radius:14px;margin-bottom:10px;z-index:1;border:1px solid #E8DCCF}
.loc-btn{width:100%;background:#EFE6D9;color:#4E3629;border:1px dashed #8B5E3C;padding:11px;border-radius:12px;font-weight:700;margin-bottom:10px;cursor:pointer}
.delivery-toggle{display:flex;gap:8px;margin-bottom:12px}
.delivery-toggle button{flex:1;padding:12px;border-radius:12px;border:1px solid #E8DCCF;background:#F5EFE6;color:#4E3629;font-weight:800;cursor:pointer}
.delivery-toggle button.active{background:#4E3629;color:#FFFDF9;border-color:#4E3629}
.infoBox{background:#F5EFE6;border:1px dashed #8B5E3C;border-radius:12px;padding:10px;font-size:12px;color:#4E3629;margin-bottom:10px;text-align:center;line-height:1.8}
#cart{position:fixed;bottom:0;left:0;right:0;background:#FFFDF9;border-top:1px solid #E8DCCF;padding:14px;border-radius:26px 26px 0 0;z-index:99;box-shadow:0 -6px 30px rgba(78,54,41,0.12)}
.line{display:flex;justify-content:space-between;font-size:12px;color:#A68B77;margin-bottom:4px}
.line.total{color:#4E3629;font-size:17px;font-weight:800;border-top:1px dashed #E8DCCF;padding-top:8px;margin-top:6px}
#sendBtn{width:100%;margin-top:12px;background:#4E3629;color:#FFFDF9;border:none;padding:15px;border-radius:14px;font-size:16px;font-weight:800}
#sendBtn:disabled{background:#EFE6D9;color:#BCA89A}
</style>
</head>
<body>

<div class="header"><h1>نبع العراد</h1><p>عجمان - توصيل سريع<br>📞 0589059844 | 0562626868</p></div>
<div id="menu"></div>

<div class="form">
<h3>📍 بيانات الطلب</h3>

<div class="delivery-toggle">
<button id="btnDelivery" class="active" onclick="setDeliveryType('delivery')">🚚 توصيل</button>
<button id="btnPickup" onclick="setDeliveryType('pickup')">🏃‍♂️ استلام من المطعم</button>
</div>

<div id="deliverySection">
<input id="area" placeholder="اسم المنطقة - مثلا النعيمية *">
<div class="row"><select id="btype"><option value="فيلا">فيلا</option><option value="بناية">بناية</option></select><input id="bnum" placeholder="رقم الفيلا / البناية *"></div>
<input id="apt" placeholder="رقم الشقة / الطابق (اختياري)">
<h3 style="margin-top:12px">📌 حدد موقعك على الخريطة لحساب التوصيل</h3>
<div id="map"></div>
<button class="loc-btn" onclick="getMyLocation()">📍 استخدم موقعي الحالي</button>
<div class="infoBox" id="distanceInfo">📏 حدد موقعك على الخريطة لحساب سعر التوصيل<br>ضمن 1 كم مجاناً | 1-5 كم = 5 درهم | 5-10 كم = 8 درهم</div>
<input id="locLink" placeholder="رابط موقعك سيظهر هنا" readonly>
</div>

<input id="phone" placeholder="رقم الموبايل *">

</div>

<div id="cart">
<div class="line"><span id="count">0 صنف</span><span id="sub">0 AED</span></div>
<div class="line"><span id="deliveryLabel">توصيل</span><span id="deliveryCost">0 AED</span></div>
<div class="line total"><span>المجموع الكلي</span><span id="grand">0 AED</span></div>
<button id="sendBtn" disabled onclick="sendWA()">أضف طلب أولاً</button>
</div>

<script>
let waNumber = "971562626868";
// موقع المطعم - عجمان (تقدر تغيره لموقعك الدقيق)
let restaurantLocation = {lat: 25.4052, lng: 55.5136};
let deliveryType = 'delivery';
let deliveryFee = 0;
let distanceKm = 0;
let currentLatLng=null, map, marker;

function setDeliveryType(type){
  deliveryType = type;
  document.getElementById('btnDelivery').classList.toggle('active', type==='delivery');
  document.getElementById('btnPickup').classList.toggle('active', type==='pickup');
  document.getElementById('deliverySection').style.display = type==='delivery'? 'block' : 'none';
  if(type==='pickup'){
    deliveryFee = 0;
    document.getElementById('deliveryLabel').innerText = 'توصيل (استلام)';
    document.getElementById('deliveryCost').innerText = '0 AED';
  } else {
    calcDelivery();
  }
  updateCart();
}

function getDistance(lat1, lon1, lat2, lon2) {
  let R = 6371;
  let dLat = (lat2-lat1)*Math.PI/180;
  let dLon = (lon2-lon1)*Math.PI/180;
  let a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
  let c = 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

function calcDelivery(){
  if(deliveryType==='pickup'){ deliveryFee=0; return; }
  if(!currentLatLng){ deliveryFee=0; return; }
  distanceKm = getDistance(restaurantLocation.lat, restaurantLocation.lng, currentLatLng.lat, currentLatLng.lng);
  if(distanceKm <= 1) deliveryFee = 0;
  else if(distanceKm <= 5) deliveryFee = 5;
  else if(distanceKm <= 10) deliveryFee = 8;
  else deliveryFee = 10;

  let info = document.getElementById('distanceInfo');
  let feeText = deliveryFee==0? 'مجاناً 🎉' : deliveryFee+' درهم';
  info.innerHTML = 📏 المسافة: ${distanceKm.toFixed(2)} كم<br>🚚 سعر التوصيل: <b>${feeText}</b>;

  document.getElementById('deliveryLabel').innerText = توصيل (${distanceKm.toFixed(1)} كم);
  document.getElementById('deliveryCost').innerText = deliveryFee==0? 'مجاناً' : deliveryFee+' AED';
}

let menuData = [
{cat:"شاورما",items:[
{name:"ساندويش شاورما دجاج",en:"Chicken Shawarma",p:[7,11,0]},
{name:"ساندويش شاورما لحم",en:"Meat Shawarma",p:[8,12,0]},
{name:"وجبة عربي دجاج",en:"Arabic Chicken Meal",p:[15,22,26]},
{name:"وجبة عربي لحم",en:"Arabic Meat Meal",p:[18,26,30]},
{name:"صحن شاورما دجاج",en:"Chicken Plate",p:[7,15,25]},
{name:"صحن بطاطا",en:"Potato Plate",p:[5,10,15]},
{name:"صحن بطاطا بالجبنة",en:"Potato with Cheese",p:[7,12,17]},
{name:"صحن شاورما لحم",en:"Meat Plate",p:[7,17,30]},
]},
{cat:"ساندويش",items:[
{name:"ساندويش كباب لحم",en:"Meat Kebab",p:[10,15,0]},
{name:"ساندويش كباب دجاج",en:"Chicken Kebab",p:[8,12,0]},
{name:"ساندويش شيش طاووق",en:"Shish Tawook",p:[8,10,0]},
{name:"ساندويش فلافل",en:"Falafel",p:[5,8,0]},
{name:"ساندويش كبدة دجاج",en:"Chicken Liver",p:[6,12,0]},
]},
{cat:"صحون ومقبلات",items:[
{name:"صحن فول",en:"Foul",p:[10,15,20]},
{name:"صحن مقالي مشكلة",en:"Mixed Fried",p:[15,20,25]},
{name:"صحن شكشوكة",en:"Shakshuka",p:[12,15,20]},
{name:"صحن حمص",en:"Hummus",p:[10,15,20]},
{name:"صحن حمص باللحمة",en:"Hummus with Meat",p:[15,20,25]},
{name:"صحن تبولة",en:"Tabbouleh",p:[12,15,20]},
{name:"صحن فتوش",en:"Fattoush",p:[12,15,20]},
]},
{cat:"مشاوي وبرجر",items:[
{name:"كيلو مشاوي مشكلة",en:"1KG Mixed Grill",p:[65,65,65]},
{name:"كيلو كباب مع تكة",en:"Kebab + Tikka",p:[75,75,75]},
{name:"كيلو شيش طاووق",en:"1KG Shish Tawook",p:[60,60,60]},
{name:"صينية مشاوي 3 كغ",en:"3KG Grill Tray",p:[160,160,160]},
{name:"برجر دجاج",en:"Chicken Burger",p:[10,10,10]},
{name:"برجر لحم",en:"Meat Burger",p:[10,10,10]},
]},
{cat:"عصائر ومشروبات",items:[
{name:"عصير مانجا",en:"Mango Juice",p:[8,8,8]},
{name:"عصير فراولة",en:"Strawberry Juice",p:[10,10,10]},
{name:"عصير برتقال",en:"Orange Juice",p:[8,8,8]},
{name:"عصير ليمون ونعناع",en:"Lemon Mint",p:[8,8,8]},
{name:"عصير بطيخ",en:"Watermelon Juice",p:[8,8,8]},
{name:"كوكتيل موز وحليب",en:"Banana Milk",p:[10,10,10]},
{name:"كوكتيل شامي",en:"Shami Cocktail",p:[12,12,12]},
{name:"لبن عيران",en:"Ayran",p:[3,3,3]},
{name:"مشروبات غازية",en:"Soft Drinks",p:[3,3,3]},
{name:"مياه معدنية",en:"Water",p:[1,1,1]},
]}
];
let cartState={}; let idCounter=0; let menuDiv=document.getElementById('menu');
menuData.forEach(section=>{
let catDiv=document.createElement('div'); catDiv.className='cat'; catDiv.innerText=section.cat; menuDiv.appendChild(catDiv);
section.items.forEach(item=>{
idCounter++;
let hasM=item.p[1]>0 && item.p[1]!=item.p[0];
let hasL=item.p[2]>0 && item.p[2]!=item.p[1] && item.p[2]!=0 && item.p[2]!=item.p[0];
cartState[idCounter]={name:item.name,price:item.p[0],qty:0,size:'S صغير'};
let div=document.createElement('div'); div.className='item'; div.dataset.prices=JSON.stringify(item.p);
div.innerHTML=<div class="item-info"><h3>${item.name}</h3><div class="en">${item.en}</div><div class="price" id="price-${idCounter}">${item.p[0]} AED</div><div class="sizes"><div class="size active" onclick="setSize(${idCounter},0,this)">صغير S</div>${hasM?<div class="size" onclick="setSize(${idCounter},1,this)">وسط M</div>:''}${hasL?<div class="size" onclick="setSize(${idCounter},2,this)">كبير L</div>:''}</div></div><div class="qty"><button onclick="changeQty(${idCounter},-1)">-</button><span id="q-${idCounter}">0</span><button onclick="changeQty(${idCounter},1)">+</button></div>;
menuDiv.appendChild(div);
});
});
map=L.map('map').setView([restaurantLocation.lat, restaurantLocation.lng],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
L.marker([restaurantLocation.lat, restaurantLocation.lng]).addTo(map).bindPopup("مطعم نبع العراد 📍").openPopup();
map.on('click',e=>setMarker(e.latlng));
function setMarker(latlng){if(marker) map.removeLayer(marker); marker=L.marker(latlng).addTo(map); currentLatLng=latlng; document.getElementById('locLink').value=https://www.google.com/maps?q=${latlng.lat},${latlng.lng}; calcDelivery(); updateCart();}
function getMyLocation(){if(navigator.geolocation){navigator.geolocation.getCurrentPosition(pos=>{let ll={lat:pos.coords.latitude,lng:pos.coords.longitude}; map.setView(ll,16); setMarker(ll);});}}
function setSize(id,idx,el){el.parentElement.querySelectorAll('.size').forEach(s=>s.classList.remove('active')); el.classList.add('active'); let all=JSON.parse(el.closest('.item').dataset.prices); let p=all[idx]; cartState[id].price=p; cartState[id].size= idx==0?'S صغير': idx==1?'M وسط':'L كبير'; document.getElementById('price-'+id).innerText=p+' AED'; updateCart();}
function changeQty(id,d){let v=cartState[id].qty+d; if(v<0)v=0; if(v>20)v=20; cartState[id].qty=v; document.getElementById('q-'+id).innerText=v; updateCart();}
function updateCart(){let sub=0,count=0,types=0; for(let k in cartState){if(cartState[k].qty>0){sub+=cartState[k].price*cartState[k].qty; count+=cartState[k].qty; types++;}} document.getElementById('count').innerText= types==0?'0 صنف':${types} اصناف - ${count} قطعة; document.getElementById('sub').innerText=sub+' AED'; let grand= count>0? sub+deliveryFee:0; document.getElementById('grand').innerText=grand+' AED'; let btn=document.getElementById('sendBtn'); if(count>0){btn.disabled=false; btn.innerText=ارسال واتساب - ${grand} AED 📲;} else{btn.disabled=true; btn.innerText='أضف طلب أولاً';}}
function sendWA(){
let area=document.getElementById('area')?.value || '';
let btype=document.getElementById('btype')?.value || '';
let bnum=document.getElementById('bnum')?.value || '';
let phone=document.getElementById('phone').value;
let apt=document.getElementById('apt')?.value || '';
let loc=document.getElementById('locLink')?.value || '';

if(!phone){alert('عبي رقم الموبايل');return;}
if(deliveryType==='delivery'){
  if(!area||!bnum){alert('عبي المنطقة ورقم الفيلا/البناية');return;}
  if(!currentLatLng){alert('حدد موقعك على الخريطة لحساب التوصيل');return;}
}

let msg=طلب جديد - مطعم نبع العراد%0A%0A;
for(let k in cartState){if(cartState[k].qty>0){msg+=• ${cartState[k].name} (${cartState[k].size}) × ${cartState[k].qty} = ${cartState[k].price*cartState[k].qty} AED%0A;}}
let sub=document.getElementById('sub').innerText;
let grand=document.getElementById('grand').innerText;
msg+=%0A--------------------%0Aمجموع الاكل: ${sub}%0A;

if(deliveryType==='pickup'){
  msg+=نوع الطلب: استلام من المطعم 🏃‍♂️%0A;
} else {
  msg+=المسافة: ${distanceKm.toFixed(2)} كم%0A;
  msg+=التوصيل: ${deliveryFee==0?'مجاناً 🎉':deliveryFee+' AED'}%0A;
}
msg+=المجموع الكلي: ${grand}%0A%0A;

if(deliveryType==='delivery'){
  msg+=📍 المنطقة: ${area}%0A🏠 ${btype}: ${bnum}%0A;
  if(apt) msg+=🏢 شقة: ${apt}%0A;
  msg+=📌 موقعي: ${loc}%0A;
} else {
  msg+=🏃‍♂️ استلام من المطعم%0A;
}
msg+=📱 موبايل: ${phone}%0A;
window.open(https://wa.me/${waNumber}?text=${msg},"_blank");
}
</script>
</body>
</html>
